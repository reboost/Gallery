name: Testing build (feature branch)

on:
    push:
        branches: [feature/saf-support-plan]
        paths-ignore:
            - ".github/**"
            - "CHANGELOG.md"
            - "docs/**"
            - "fastlane/**"
            - "LICENSE"
            - "README.md"

jobs:
    call-testing-build-workflow:
        uses: FossifyOrg/.github/.github/workflows/testing-build.yml@main
        secrets: inherit
